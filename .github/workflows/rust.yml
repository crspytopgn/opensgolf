name: rust

# on pushes to main and on pull requests (not on both for the same commit)
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # the compiled dependencies kept between runs (keyed by Cargo.lock and the toolchain): only what changed is rebuilt
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        # the runners' own resolver has failed to look up Ubuntu's mirrors (November 2026): ask public DNS servers too, and let apt retry
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\nFallbackDNS=9.9.9.9\n' | sudo tee /etc/systemd/resolved.conf.d/public.conf >/dev/null || true
          sudo systemctl restart systemd-resolved || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libasound2-dev libudev-dev xvfb libgl1-mesa-dri fonts-dejavu-core
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        # Bug-class lints fail the build; style lints only warn, so a new Rust release cannot turn CI red on its own.
        run: cargo clippy --release --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      # No game data in CI: the game plays on its free base set (opensgolf-free, drawn by the engine itself). The play test
      # decodes every file of the set, starts a new game, builds a hole, plays about three months, saves, loads and opens
      # every report on a virtual display, and fails on a crash or any missing-file or decode error (tools/freeset_playtest.sh).
      - name: Headless play test on the free base set
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          tools/freeset_playtest.sh freeset-test
          cp freeset-test/newgame.png play.png
          cp freeset-test/title-menu.png menu.png
      - uses: actions/upload-artifact@v4
        with:
          name: opensgolf-${{ matrix.os }}
          path: |
            target/release/opensgolf${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/sgtool${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/sgplay${{ runner.os == 'Windows' && '.exe' || '' }}
            *.png
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the browser version
        run: ./web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opensgolf-web
          path: web/dist
