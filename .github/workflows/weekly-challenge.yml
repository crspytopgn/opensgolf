# The weekly challenge in the community Discord (tools/weekly_challenge.py): every Monday at midday UK time, this week's
# challenge and last week's top 3. GitHub's schedule is in UTC, so it runs at 11:00 and 12:00 UTC and only the run that
# falls on 12 o'clock in London posts (11:00 UTC in summer time, 12:00 UTC in winter). The webhook is in the
# DISCORD_CHALLENGE_WEBHOOK secret; without it the run says so and does nothing. Run it by hand (Actions > Weekly
# challenge posts > Run workflow) to send the Monday post now, a one-off "leaders so far" post, or a short test line that
# checks the webhook works.
name: Weekly challenge posts

on:
  schedule:
    - cron: "0 11 * * 1" # Monday midday in London during summer time
    - cron: "0 12 * * 1" # Monday midday in London the rest of the year
  workflow_dispatch:
    inputs:
      post:
        description: Which post
        type: choice
        options: [new, leaders, test]
        default: new

permissions: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHALLENGE_WEBHOOK }}
          POST: ${{ github.event_name == 'workflow_dispatch' && inputs.post || 'new' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::DISCORD_CHALLENGE_WEBHOOK is not set: no Discord post"; exit 0; fi
          if [ "$SCHEDULED" = true ]; then
            # the run for the other half of the year stands down (a late start still counts by the hour it was meant for)
            want=$([ "$(TZ=Europe/London date -d 'today 12:00 UTC' +%H)" = 12 ] && echo "0 12 * * 1" || echo "0 11 * * 1")
            if [ "$CRON" != "$want" ]; then echo "not midday in London at this run's hour: no post"; exit 0; fi
          fi
          python3 tools/weekly_challenge.py "$POST" > payload.json
          curl -fsS -H "Content-Type: application/json" -A opensgolf-weekly --data @payload.json "$WEBHOOK" -o /dev/null -w "Discord answered %{http_code}\n"
