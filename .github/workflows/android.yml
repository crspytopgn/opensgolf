name: android

# Builds the Android app (a debug APK for arm64, 32-bit arm and x86_64, signed with a debug key) on every push, in the
# notfl3/cargo-apk docker image (Android SDK, NDK, cargo-quad-apk); see tools/android_build.sh. Releases attach a release
# build of it (release.yml).

on:
  push:
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust check for Android (no NDK needed; fails fast on Android-only code)
        run: |
          rustup target add aarch64-linux-android
          cargo check --target aarch64-linux-android -p opensgolf --no-default-features
      - name: Build the APK
        run: docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk tools/android_build.sh debug /root/src/apk
      - uses: actions/upload-artifact@v4
        with:
          name: opensgolf-android-debug
          path: apk/opensgolf-debug.apk
