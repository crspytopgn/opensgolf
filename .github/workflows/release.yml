name: release

# Pushing a tag such as v0.1.0, or running this workflow by hand with a version (Actions > release > Run workflow), builds
# OpenSGolf for every platform and publishes a GitHub release with the packages. The file names carry no version, so the
# README's links to releases/latest/download/<name> always give the newest release:
#   Linux    opensgolf-linux-x86_64.tar.gz and opensgolf-linux-x86_64.AppImage
#   ARM64    opensgolf-linux-arm64.tar.gz and opensgolf-linux-arm64.AppImage (64-bit ARM Linux, Raspberry Pi 4/5)
#   macOS    opensgolf-macos.zip (OpenSGolf.app, Apple silicon and Intel)
#   Windows  opensgolf-windows.zip (x64) and opensgolf-windows-arm64.zip (Windows on ARM, e.g. Snapdragon laptops)
#   Android  opensgolf-android.apk (signed with a debug key, for sideloading)
#   browser  opensgolf-web.zip
# The icon is the engine's own drawing (sg_core::freeset::app_icon, `sgtool icon`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v0.1.1 (empty: build the packages only, no release)"
        required: false

permissions:
  contents: write

env:
  BIN: opensgolf
  # the version: the pushed tag, or the version typed when running the workflow by hand
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'dev' }}

jobs:
  linux:
    # x86_64 PCs, and 64-bit ARM (Raspberry Pi 4/5, ARM laptops) on GitHub's ARM runners. Built on the oldest Ubuntu LTS
    # in standard support, because a program needs a glibc at least as new as the one it was built against: built here,
    # the AppImage and tar.gz run on that release and anything newer.
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, name: x86_64, appimage: x86_64 }
          - { os: ubuntu-22.04-arm, name: arm64, appimage: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build
        run: cargo build --release -p opensgolf -p sgtool
      - name: glibc check
        # fails the release if the game needs a newer glibc than Ubuntu 22.04's (2.35)
        run: |
          need=$(objdump -T target/release/opensgolf | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "opensgolf needs $need"
          [ "$(printf '%s\n%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ]
      - name: Icons
        run: target/release/sgtool icon icons 256
      - name: tar.gz
        run: |
          out="opensgolf-linux-${{ matrix.name }}"
          mkdir -p "$out"
          cp target/release/opensgolf target/release/sgtool "$out/"
          cp LICENSE README.md docs/PLAYING.md docs/MODDING.md packaging/linux/opensgolf.desktop "$out/"
          cp icons/icon_256.png "$out/opensgolf.png"
          cp -r packs lang "$out/"
          tar czf "$out.tar.gz" "$out"
      - name: AppImage
        run: |
          # the game finds its packs and translations next to the program (usr/bin), its saves in ~/.local/share/opensgolf
          app=AppDir
          mkdir -p "$app/usr/bin" "$app/usr/share/applications" "$app/usr/share/icons/hicolor/256x256/apps"
          cp target/release/opensgolf target/release/sgtool "$app/usr/bin/"
          cp -r packs lang "$app/usr/bin/"
          cp packaging/linux/opensgolf.desktop "$app/" && cp packaging/linux/opensgolf.desktop "$app/usr/share/applications/"
          cp icons/icon_256.png "$app/opensgolf.png"
          cp icons/icon_256.png "$app/usr/share/icons/hicolor/256x256/apps/opensgolf.png"
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/opensgolf" "$@"\n' > "$app/AppRun"
          chmod +x "$app/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage }}.AppImage
          chmod +x appimagetool
          ARCH=${{ matrix.appimage }} APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$app" "opensgolf-linux-${{ matrix.name }}.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: |
            opensgolf-*.tar.gz
            opensgolf-*.AppImage

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$t" -p opensgolf -p sgtool
          done
      - name: OpenSGolf.app
        run: |
          app=OpenSGolf.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          # one universal program for Apple silicon and Intel Macs
          for b in opensgolf sgtool; do
            lipo -create -output "$app/Contents/MacOS/$b" "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
          # the game finds its packs and translations next to the program, its saves in ~/Library/Application Support/OpenSGolf
          cp -r packs lang "$app/Contents/MacOS/"
          sed "s/@VERSION@/${VERSION#v}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # the icon: every size iconutil wants, drawn by sgtool
          target/aarch64-apple-darwin/release/sgtool icon icons 16 32 64 128 256 512 1024
          set=opensgolf.iconset && mkdir -p "$set"
          for n in 16 32 128 256 512; do
            cp "icons/icon_$n.png" "$set/icon_${n}x${n}.png"
            cp "icons/icon_$((n * 2)).png" "$set/icon_${n}x${n}@2x.png"
          done
          iconutil -c icns "$set" -o "$app/Contents/Resources/opensgolf.icns"
          # not notarised: an ad-hoc signature lets it run once the player allows it (README, Install)
          codesign --force --deep --sign - "$app"
          out="opensgolf-macos"
          mkdir -p "$out"
          mv "$app" "$out/"
          cp LICENSE README.md docs/PLAYING.md docs/MODDING.md "$out/"
          ditto -c -k --keepParent "$out" "$out.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: opensgolf-macos.zip

  windows:
    strategy:
      matrix:
        include:
          # the x64 package keeps its old name so existing download links keep working
          - { os: windows-latest, name: x86_64, out: opensgolf-windows }
          - { os: windows-11-arm, name: arm64, out: opensgolf-windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p opensgolf -p sgtool
      - name: Package
        shell: bash
        run: |
          out="${{ matrix.out }}"
          mkdir -p "$out"
          cp target/release/opensgolf.exe target/release/sgtool.exe "$out/"
          target/release/sgtool.exe icon icons 256
          cp icons/icon_256.png "$out/opensgolf.png"
          cp LICENSE README.md docs/PLAYING.md docs/MODDING.md "$out/"
          cp -r packs lang "$out/"
          7z a "$out.zip" "$out" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}
          path: ${{ matrix.out }}.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the APK (notfl3/cargo-apk image)
        env:
          # optional: a base64 debug.keystore (store and key password "android", alias "androiddebugkey") so that every
          # release is signed with the same key and installs over the last one; without it each build makes a new key
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p android-home
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > android-home/debug.keystore; fi
          docker run --rm -v "$PWD":/root/src -v "$PWD/android-home":/root/.android -w /root/src notfl3/cargo-apk \
            tools/android_build.sh release /root/src/apk
          sudo cp apk/opensgolf-release.apk "opensgolf-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: opensgolf-android.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the browser version
        run: ./web/build.sh
      - name: Package
        run: |
          cp LICENSE web/dist/
          (cd web/dist && zip -qr "../../opensgolf-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: opensgolf-web.zip

  publish:
    needs: [linux, macos, windows, android, web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # a run by hand creates the tag on the commit it built
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: OpenSGolf ${{ env.VERSION }}
          files: dist/*
          make_latest: true
          generate_release_notes: true
