name: Bug report
description: Something crashes, misbehaves or looks broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
      value: |
        What I did:

        What I expected:

        What happened instead:
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version or commit (shown in Preferences), or "browser".
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Windows, macOS, Linux, Browser (desktop), Browser (phone or tablet), Android or iOS.
  - type: input
    id: baseset
    attributes:
      label: Base set
      description: Original game files, or OpenSGolf free set.
  - type: input
    id: system
    attributes:
      label: System
      description: Filled in by the game's Report a problem (Preferences > More); leave empty otherwise.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, save file, log
      description: Drag in the files the game's Report a problem wrote (the save, the screenshot and the text file with its warnings), or your own.
