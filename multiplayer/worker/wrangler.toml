# The multiplayer Worker (README.md): the weekly board and the shared clubs. Deployed 2026-11-18 to
# https://opensgolf-board.openmcm2-laps.workers.dev; redeploy from this folder with npx wrangler@4.152.0 deploy.
name = "opensgolf-board"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "opensgolf-board"
database_id = "f9841ce7-7018-47cf-9c3a-0bc85ef1cdcc"

# Cloud saves (src/cloud.js): the browser version's optional copy of a player's saves, by sync code.
[[r2_buckets]]
binding = "SAVES"
bucket_name = "opensgolf-saves"

[observability]
enabled = true

# The shared clubs (src/club.js): one Durable Object per club, SQLite storage (the free plan's kind).
[[durable_objects.bindings]]
name = "CLUB"
class_name = "Club"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Club"]
