[package]
name = "opensgolf"
description = "OpenSGolf: the game (with the free base set, or the data of your own copy of SimGolf)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sg-core = { path = "../sg-core" }
miniquad = "0.4"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
cpal = { version = "0.15", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Preferences > Content > Find more (docs/MODDING.md 7): a small HTTPS client in pure Rust (rustls), desktop only; the
# browser version downloads through the page's fetch()
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }
# "Update now" (autoupdate.rs): the release's SHA256SUMS is checked against OpenSGolf's ed25519 signing key before anything
# downloaded is installed. A small pure-Rust implementation with no dependencies of its own.
ed25519-compact = { version = "2", optional = true, default-features = false }

# "Use my SimGolf files..." (gamefiles.rs): the system's own folder picker on Windows, macOS and Linux. On Linux it asks
# the desktop through the XDG portal over D-Bus (no GTK, nothing extra to install to build it). Not built for the browser
# or Android, which have their own ways in.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }
# Controllers (gamepad.rs): Xbox, PlayStation, Switch and Steam Deck controllers on Windows, macOS and Linux (on Linux it
# needs libudev to build, the libudev-dev package). The browser reads them through the page.
gilrs = { version = "0.11", optional = true }

[features]
default = ["audio", "net", "picker", "gamepad"]
# Sound output through the system's audio device (CoreAudio, WASAPI, ALSA). Without it the game runs silent.
audio = ["dep:cpal"]
# Downloading content packs over HTTPS (desktop), Check for updates and Update now. Without it only file:// content
# indexes work.
net = ["dep:ureq", "dep:ed25519-compact"]
# The system folder picker of "Use my SimGolf files..." (desktop). Without it the option says where to put the files.
picker = ["dep:rfd"]
# Controllers on the desktop (gamepad.rs). Without it only the browser reads controllers.
gamepad = ["dep:gilrs"]

# Android only: hands miniquad's Java VM to cpal's oboe sound output (src/android.rs).
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"

# The Android app (docs/PLAYING.md, "Android"), built with cargo-quad-apk (the notfl3/cargo-apk docker image,
# .github/workflows/android.yml): `cargo quad-apk build --release -p opensgolf`.
[package.metadata.android]
package_name = "org.opensgolf.game"
label = "OpenSGolf"
version_code = 24
version_name = "0.4.0"
min_sdk_version = 26
target_sdk_version = 33
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
fullscreen = true
opengles_version_major = 3
opengles_version_minor = 0
# the launcher icon: sg_core::freeset::app_icon, written by `sgtool icon` (tools/make_icons.sh)
res = "android/res"
icon = "@mipmap/ic_launcher"
# The app reads and writes only its own folders (its internal data folder and Android/data/org.opensgolf.game/files, which
# need no permission). Its one permission: "Update now" hands a downloaded, signature-checked APK to Android's installer
# (src/autoupdate.rs, MainActivity.installApk); Android still asks the player before installing anything.
[[package.metadata.android.permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "sensorLandscape"
# Android 12 and newer refuse a launcher activity that does not say this
"android:exported" = "true"
