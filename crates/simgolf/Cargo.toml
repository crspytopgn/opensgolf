[package]
name = "opensgolf"
description = "OpenSGolf: the game (with the free base set, or the data of your own copy of SimGolf)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sg-core = { path = "../sg-core" }
miniquad = "0.4"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
cpal = { version = "0.15", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Preferences > Content > Find more (docs/MODDING.md 7): a small HTTPS client in pure Rust (rustls), desktop only; the
# browser version downloads through the page's fetch()
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }

# "Use my SimGolf files..." (gamefiles.rs): the system's own folder picker on Windows, macOS and Linux. On Linux it asks
# the desktop through the XDG portal over D-Bus (no GTK, nothing extra to install to build it). Not built for the browser
# or Android, which have their own ways in.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }

[features]
default = ["audio", "net", "picker"]
# Sound output through the system's audio device (CoreAudio, WASAPI, ALSA). Without it the game runs silent.
audio = ["dep:cpal"]
# Downloading content packs over HTTPS (desktop). Without it only file:// content indexes work.
net = ["dep:ureq"]
# The system folder picker of "Use my SimGolf files..." (desktop). Without it the option says where to put the files.
picker = ["dep:rfd"]

# Android only: hands miniquad's Java VM to cpal's oboe sound output (src/android.rs).
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"

# The Android app (docs/PLAYING.md, "Android"), built with cargo-quad-apk (the notfl3/cargo-apk docker image,
# .github/workflows/android.yml): `cargo quad-apk build --release -p opensgolf`.
[package.metadata.android]
package_name = "org.opensgolf.game"
label = "OpenSGolf"
version_code = 10
version_name = "0.2.2"
min_sdk_version = 26
target_sdk_version = 33
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
fullscreen = true
opengles_version_major = 3
opengles_version_minor = 0
# the launcher icon: sg_core::freeset::app_icon, written by `sgtool icon` (tools/make_icons.sh)
res = "android/res"
icon = "@mipmap/ic_launcher"
# no permissions: the app reads and writes only its own folders (its internal data folder and
# Android/data/org.opensgolf.game/files, which need none)

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "sensorLandscape"
# Android 12 and newer refuse a launcher activity that does not say this
"android:exported" = "true"
