[package]
name = "sg-core"
description = "SimGolf native port: asset decoders, data formats and game rules (no windowing, no audio device)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fontdue = "0.9"
lewton = "0.10"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
