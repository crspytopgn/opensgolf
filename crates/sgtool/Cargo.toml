[package]
name = "sgtool"
description = "OpenSGolf: inspect and convert the original game's assets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sg-core = { path = "../sg-core" }
# `sgtool update-keygen` (docs/RELEASING.md): a new key pair for signing releases
ed25519-compact = { version = "2", default-features = false }
